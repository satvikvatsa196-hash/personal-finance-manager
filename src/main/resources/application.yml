spring:
  application:
    name: personal-finance-manager
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance_manager}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
  servlet:
    session:
      cookie:
        same-site: strict
        secure: true
